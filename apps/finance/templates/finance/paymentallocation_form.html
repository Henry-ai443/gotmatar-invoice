{% extends 'base.html' %}
{% load humanize %}

{% block title %}Edit Allocation{% endblock %}

{% block content %}
<div class="container">
  <h3>Edit Allocation</h3>

    {{ form.as_p }}

  </form>
</div>
{% endblock %}
